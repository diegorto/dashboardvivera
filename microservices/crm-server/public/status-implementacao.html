  document.getElementById('stats').innerHTML = '<div class="stat"><b>' + total + '</b>Itens no total</div><div class="stat"><b>' + impl + '</b>Implementados</div><div class="stat"><b>' + (total-impl) + '</b>Nao implementados</div><div class="stat"><b>' + test + '</b>Testados e funcionando</div>';

}

const PRIORITY_SET = new Set([1,125,126,129,133,135,136,137,138,139,142,143,144,145,146,147,152,163,167,168]);

let overridesMap = new Map();
let grid = null;

function computeGridData(){
  return DATA.map(function(d){
    const obs = d[4] || '';
    let pct;
    if (/OBSOLETO/i.test(obs)) pct = null;
    else if (d[2] && d[3]) pct = 100;
    else if (d[2] && !d[3]) pct = 80;
    else if (/Em implementacao|PRIORIZADO|CONCLUIDO/i.test(obs)) pct = 30;
    else pct = 0;
    const isDone = !!(d[2] && d[3]);
    const status = overridesMap.has(d[0]) ? overridesMap.get(d[0]) : (PRIORITY_SET.has(d[0]) ? 'prioritario' : 'normal');
    let prioSort;
    if (isDone) prioSort = 3;
    else if (status === 'prioritario') prioSort = 0;
    else if (status === 'excluido') prioSort = 2;
    else prioSort = 1;
    return {num:d[0], item:d[1], impl:d[2], test:d[3], pct:pct, status:status, isDone:isDone, prioSort:prioSort, obs:d[4]};
  }).sort(function(a,b){ return a.prioSort - b.prioSort || a.num - b.num; });
}

window.__setBacklogPriority = function(num, status){
  overridesMap.set(num, status);
  fetch('/api/crm/ui/backlog-priority/' + num, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: status })
  }).catch(function(e){ console.error('erro ao salvar prioridade', e); });
  grid.updateConfig({ data: computeGridData() }).forceRender();
};

function priorityRadios(num, status){
  const opts = [
    { value: 'excluido', label: 'Excluir', color: '#cf222e' },
    { value: 'prioritario', label: 'Prioritario', color: '#9a6700' },
    { value: 'normal', label: 'Fila normal', color: '#666' }
  ];
  let html = '<div style="white-space:nowrap;">';
  opts.forEach(function(o){
    const checked = status === o.value ? ' checked' : '';
    const weight = status === o.value ? '600' : '400';
    html += '<label style="margin-right:8px;font-size:12px;color:' + o.color + ';font-weight:' + weight + ';cursor:pointer;">' +
      '<input type="radio" name="prio_' + num + '" value="' + o.value + '" data-item="' + num + '"' + checked + '> ' + o.label +
      '</label>';
  });
  html += '</div>';
  return html;
}

fetch('/api/crm/ui/backlog-priority').then(function(r){ return r.json(); }).then(function(j){
  if (j && j.success && Array.isArray(j.overrides)) {
    j.overrides.forEach(function(o){ overridesMap.set(o.item_num, o.status); });
  }
}).catch(function(e){ console.error('erro ao carregar prioridades salvas', e); }).then(function(){
  grid = new gridjs.Grid({
    columns: [
      { id: 'num', name: '#', width: '50px', sort:true },
      { id: 'status', name: 'Priorizacao', width:'260px', sort:false, formatter: function(cell, row){
          const done = !!(row.cells[3].data && row.cells[4].data);
          if (done) {
            return gridjs.html('<span style="color:#1a7f37;font-weight:600;font-size:12px;">Concluido &#10003;</span>');
          }
          return gridjs.html(priorityRadios(row.cells[0].data, cell));
        } },
      { id: 'item', name: 'Item', sort:true, formatter: function(cell, row){
          const status = row.cells[1].data;
          const done = !!(row.cells[3].data && row.cells[4].data);
          if (!done && status === 'excluido') {
            return gridjs.html('<span style="opacity:0.5;">' + cell + ' <i>(excluido do projeto)</i></span>');
          }
          return cell;
        } },
      { id: 'impl', name: 'Implementado', width:'120px', sort:true, formatter: (cell) => gridjs.html(cell ? '<span class="ok">SIM</span>' : '<span class="no">NAO</span>') },
      { id: 'test', name: 'Testado e funcionando', width:'150px', sort:true, formatter: (cell) => gridjs.html(cell ? '<span class="ok">SIM</span>' : '<span class="no">NAO</span>') },
      { id: 'pct', name: '% Concluido', width:'110px', sort:true, formatter: (cell) => gridjs.html(cell === null ? '<span class="obs">N/A</span>' : (cell >= 100 ? '<span class="ok">' + cell + '%</span>' : (cell === 0 ? '<span class="no">' + cell + '%</span>' : '<span class="warn">' + cell + '%</span>'))) },
      { id: 'obs', name: 'Obs', formatter: (cell) => gridjs.html('<span class="obs">' + (cell || '') + '</span>') },
    ],
    data: computeGridData(),
    sort: true,
    search: true,
    pagination: { limit: 25 },
    style: { table: { 'font-size':'13px' } }
  }).render(document.getElementById('gridContainer'));
});

document.getElementById('gridContainer').addEventListener('change', function(e){
  const t = e.target;
  if (t && t.matches('input[type=radio][data-item]')) {
    const num = parseInt(t.getAttribute('data-item'), 10);
    window.__setBacklogPriority(num, t.value);
  }
});

document.getElementById('search').addEventListener('input', (e) => {
  grid.updateConfig({ search: { keyword: e.target.value } }).forceRender();
});
</script>

<script>(function(){
  try {
    var u = JSON.parse(localStorage.getItem('crm_user') || 'null');
    if (u && u.role === 'comercial_robo' && false) {
      location.replace('/whatsapp.html');
    }
  } catch (e) {}
})();</script>
</body>
